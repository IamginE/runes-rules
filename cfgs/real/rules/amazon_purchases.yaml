dataset:
  batching_strategy: random_start
  name: amazon_purchases
  type: real_dataset_irreg
logging:
  name: rules
  save_dir: logs/real/amazon_purchases
model:
  decay_conjunction_temp: 0.95
  decay_neuron_temp: 0.92
  initial_temperature: 1.0
  max_relative_distance: 20
  max_sequence_length: 64
  num_neurons: 500
  num_rules: 200
  only_full_window: false
  regular_sampling: false
  sequence_dim: 993
  type: rules
optimization:
  batch_size: 64
  lr_decay: 1.0
  lr_patience: 0
  max_epochs: 4000
  num_lr_decreases: 0
  optimizer:
    kind: adam
    params:
      lr: 0.03
  plateau_delta: 0.0
  steps_temp_annealing: 32
  warmup_epochs: 200
  stop_annealing_conjunction: 0.00001
  lambda_reg_int: 0.0
  lambda_reg_act: 1.0
discretization:
  quantile_q: 0.8
  inclusion_threshold: 0.9


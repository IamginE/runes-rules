dataset:
  batching_strategy: random_start
  name: commits
  type: real_dataset_reg
logging:
  name: rules
  save_dir: logs/real/commits
model:
  decay_conjunction_temp: 0.9
  decay_neuron_temp: 0.9
  initial_temperature: 1.0
  max_relative_distance: 24
  max_sequence_length: 64
  num_neurons: 300
  num_rules: 100
  only_full_window: false
  regular_sampling: true
  sequence_dim: 119
  type: rules
optimization:
  batch_size: 64
  lr_decay: 1.0
  lr_patience: 0
  max_epochs: 4000
  num_lr_decreases: 0
  optimizer:
    kind: adam
    params:
      lr: 0.03
  plateau_delta: 0.0
  steps_temp_annealing: 32
  warmup_epochs: 60
  stop_annealing_conjunction: 0.00001
  lambda_reg_int: 0.0
discretization:
  quantile_q: 0.95
  inclusion_threshold: 0.9


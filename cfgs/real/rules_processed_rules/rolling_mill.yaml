dataset:
  batching_strategy: samples
  name: rolling_mill
  type: real_dataset_reg
logging:
  save_dir: logs/real/rolling_mill
model:
  max_relative_distance: 64
  max_sequence_length: 142
  only_full_window: false
  regular_sampling: true
  sequence_dim: 556
  type: rules_processed_rules
optimization:
  batch_size: 64
  lr_decay: 0.3
  lr_patience: 10
  max_epochs: 1000
  num_lr_decreases: 10
  optimizer:
    kind: adam
    params:
      lr: 0.03
  plateau_delta: 0.01
  warmup_epochs: 10

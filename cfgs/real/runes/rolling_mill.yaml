dataset:
  batching_strategy: samples
  name: rolling_mill
  type: real_dataset_reg
logging:
  name: runes
  save_dir: logs/real/rolling_mill
model:
  transformer_residual_network:
    activation: gelu
    att_dim: 128
    dropout: 0.1
    embedding_dim: 128
    final_nn_dim: 128
    final_nn_num_layers: 2
    max_relative_distance: 64
    max_sequence_length: 142
    num_heads: 4
    only_full_window: false
    regular_sampling: true
    sequence_dim: 556
    transformer_ff_nn_dim: 256
    transformer_num_layers: 4
  type: runes
rules_base_model_loc: logs/real/rolling_mill
optimization:
  batch_size: 64
  max_epochs: 1000
  optimizer:
    kind: adam
    params:
      lr: 0.0003
  scheduler:
    kind: on_plateau
    params:
      factor: 0.1
      mode: min
      patience: 10
      threshold: 0.01
      threshold_mode: abs

